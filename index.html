<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --white-10: rgba(255,255,255,0.10);
      --white-15: rgba(255,255,255,0.15);
      --white-20: rgba(255,255,255,0.20);
      --white-60: rgba(255,255,255,0.60);
      --white-80: rgba(255,255,255,0.80);
      --white-90: rgba(255,255,255,0.90);
      --accent: #6c63ff;
      --accent-hover: #574fd6;
      --error: #ff6b6b;
      --border: rgba(255,255,255,0.25);
      --shadow: 0 8px 32px rgba(0,0,0,0.35);
      --radius: 16px;
      --transition: 0.25s ease;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* ── Video background ── */
    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(0,0,0,0.55) 0%,
        rgba(30,20,60,0.45) 100%
      );
      z-index: -1;
    }

    /* ── Page layout ── */
    .page {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 1rem;
    }

    /* ── Glass card ── */
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.18);
      padding: 2.5rem 2rem 2rem;
      animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Logo / Title ── */
    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      margin-bottom: 0.75rem;
      box-shadow: 0 4px 20px rgba(108,99,255,0.5);
    }

    .brand-icon svg {
      width: 28px;
      height: 28px;
      fill: #fff;
    }

    .brand h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .brand p {
      margin-top: 0.3rem;
      font-size: 0.875rem;
      color: var(--white-60);
    }

    /* ── Tab switcher ── */
    .tabs {
      display: flex;
      background: rgba(0,0,0,0.20);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 1.75rem;
    }

    .tab-btn {
      flex: 1;
      padding: 0.55rem;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--white-60);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background var(--transition), color var(--transition);
    }

    .tab-btn.active {
      background: rgba(255,255,255,0.14);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    .tab-btn:hover:not(.active) {
      color: var(--white-80);
    }

    /* ── Forms ── */
    .form-panel {
      display: none;
    }

    .form-panel.active {
      display: block;
      animation: fadeIn 0.3s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(10px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .field {
      margin-bottom: 1rem;
    }

    .field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--white-80);
      margin-bottom: 0.4rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 17px;
      height: 17px;
      stroke: var(--white-60);
      pointer-events: none;
      transition: stroke var(--transition);
    }

    .field input {
      width: 100%;
      padding: 0.7rem 0.85rem 0.7rem 2.5rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color var(--transition), background var(--transition), box-shadow var(--transition);
    }

    .field input::placeholder {
      color: rgba(255,255,255,0.35);
    }

    .field input:focus {
      border-color: var(--accent);
      background: rgba(108,99,255,0.12);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.25);
    }

    .field input:focus + svg,
    .input-wrap:focus-within svg {
      stroke: var(--accent);
    }

    /* eye toggle */
    .eye-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px;
      color: var(--white-60);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color var(--transition);
    }

    .eye-btn:hover { color: #fff; }

    .eye-btn svg {
      position: static;
      transform: none;
      width: 17px;
      height: 17px;
      stroke: currentColor;
      pointer-events: none;
    }

    /* ── Remember + Forgot ── */
    .form-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0.25rem 0 1.25rem;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      color: var(--white-60);
      cursor: pointer;
      user-select: none;
    }

    .remember input[type="checkbox"] {
      accent-color: var(--accent);
      width: 15px;
      height: 15px;
    }

    .forgot {
      font-size: 0.82rem;
      color: var(--accent);
      text-decoration: none;
      transition: opacity var(--transition);
    }

    .forgot:hover { opacity: 0.75; }

    /* ── Primary button ── */
    .btn-primary {
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #818cf8);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.01em;
      box-shadow: 0 4px 18px rgba(108,99,255,0.45);
      transition: opacity var(--transition), transform var(--transition), box-shadow var(--transition);
      position: relative;
      overflow: hidden;
    }

    .btn-primary::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0);
      transition: background 0.2s ease;
    }

    .btn-primary:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(108,99,255,0.55);
    }

    .btn-primary:active {
      transform: translateY(0);
      box-shadow: 0 2px 10px rgba(108,99,255,0.35);
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.25rem 0;
      color: var(--white-60);
      font-size: 0.8rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.15);
    }

    /* ── Social buttons ── */
    .social-row {
      display: flex;
      gap: 0.75rem;
    }

    .btn-social {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.6rem;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      color: var(--white-80);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
    }

    .btn-social:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.30);
    }

    .btn-social svg {
      width: 18px;
      height: 18px;
    }

    /* ── Terms (register) ── */
    .terms {
      margin-top: 1rem;
      font-size: 0.78rem;
      color: var(--white-60);
      text-align: center;
      line-height: 1.5;
    }

    .terms a {
      color: var(--accent);
      text-decoration: none;
    }

    .terms a:hover { opacity: 0.75; }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .card { padding: 2rem 1.25rem 1.5rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

  <!-- Video Background -->
  <video class="bg-video" autoplay muted loop playsinline>
    <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260319_055001_8e16d972-3b2b-441c-86ad-2901a54682f9.mp4" type="video/mp4" />
  </video>
  <div class="bg-overlay"></div>

  <!-- Login / Register Card -->
  <main class="page">
    <div class="card" role="main">

      <!-- Brand -->
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
          </svg>
        </div>
        <h1>Welcome Back</h1>
        <p>Sign in to continue your journey</p>
      </div>

      <!-- Tabs -->
      <div class="tabs" role="tablist" aria-label="Authentication mode">
        <button class="tab-btn active" role="tab" aria-selected="true"  aria-controls="panel-login"    id="tab-login"    onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn"        role="tab" aria-selected="false" aria-controls="panel-register" id="tab-register" onclick="switchTab('register')">Create Account</button>
      </div>

      <!-- ══ LOGIN PANEL ══ -->
      <div class="form-panel active" id="panel-login" role="tabpanel" aria-labelledby="tab-login">
        <form id="form-login" novalidate onsubmit="handleLogin(event)">

          <div class="field">
            <label for="login-email">Email</label>
            <div class="input-wrap">
              <input type="email" id="login-email" name="email" placeholder="you@example.com" autocomplete="email" required />
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25H4.5A2.25 2.25 0 012.25 17.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5H4.5A2.25 2.25 0 002.25 6.75m19.5 0-9.75 6.75L2.25 6.75"/>
              </svg>
            </div>
          </div>

          <div class="field">
            <label for="login-password">Password</label>
            <div class="input-wrap" style="position:relative">
              <input type="password" id="login-password" name="password" placeholder="Enter your password" autocomplete="current-password" required />
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
              </svg>
              <button type="button" class="eye-btn" onclick="togglePwd('login-password', this)" aria-label="Show password">
                <svg id="eye-login" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="1.8" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-meta">
            <label class="remember">
              <input type="checkbox" /> Remember me
            </label>
            <a href="#" class="forgot">Forgot password?</a>
          </div>

          <button type="submit" class="btn-primary">Sign In</button>

          <div class="divider">or continue with</div>

          <div class="social-row">
            <button type="button" class="btn-social" aria-label="Continue with Google">
              <!-- Google icon -->
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path fill="#EA4335" d="M5.27 9.76A7.08 7.08 0 0 1 12 4.93c1.7 0 3.22.61 4.42 1.61l3.3-3.3A11.95 11.95 0 0 0 12 .93C7.45.93 3.55 3.77 1.73 7.81l3.54 1.95z"/>
                <path fill="#34A853" d="M16.04 18.01A7.08 7.08 0 0 1 12 19.07c-3.12 0-5.78-2.01-6.73-4.83L1.73 16.2C3.55 20.23 7.45 23.07 12 23.07c2.93 0 5.7-1.07 7.78-3l-3.74-2.06z"/>
                <path fill="#4A90D9" d="M19.78 20.07A11.95 11.95 0 0 0 23.07 12c0-.7-.07-1.38-.18-2.04H12v4.28h6.18a5.23 5.23 0 0 1-2.32 3.48l3.92 2.35z"/>
                <path fill="#FBBC05" d="M5.27 14.24A7.08 7.08 0 0 1 4.93 12c0-.77.12-1.52.34-2.24L1.73 7.81A11.94 11.94 0 0 0 .93 12c0 1.93.46 3.75 1.27 5.37l3.07-3.13z"/>
              </svg>
              Google
            </button>
            <button type="button" class="btn-social" aria-label="Continue with Apple">
              <!-- Apple icon -->
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
                <path d="M16.365 1.43c0 1.14-.493 2.27-1.177 3.08-.744.9-1.99 1.57-2.987 1.57-.12 0-.23-.02-.3-.03-.01-.06-.04-.22-.04-.39 0-1.15.572-2.27 1.206-2.98.804-.94 2.142-1.64 3.248-1.68.03.13.05.28.05.43zm4.565 15.71c-.03.07-.463 1.58-1.518 3.12-.945 1.34-1.94 2.71-3.43 2.71-1.517 0-1.9-.88-3.63-.88-1.698 0-2.302.91-3.67.91-1.377 0-2.332-1.26-3.428-2.71C4.55 17.76 3.75 14.37 3.75 11.1c0-4.86 3.17-7.43 6.29-7.43 1.62 0 2.97.9 3.97.9.935 0 2.396-.95 4.26-.95.68 0 3.11.07 4.73 2.46-.17.1-2.83 1.66-2.83 5.01 0 3.9 3.46 5.24 3.5 5.26l-.74 1.78z"/>
              </svg>
              Apple
            </button>
          </div>

        </form>
      </div>

      <!-- ══ REGISTER PANEL ══ -->
      <div class="form-panel" id="panel-register" role="tabpanel" aria-labelledby="tab-register">
        <form id="form-register" novalidate onsubmit="handleRegister(event)">

          <div class="field">
            <label for="reg-name">Full Name</label>
            <div class="input-wrap">
              <input type="text" id="reg-name" name="name" placeholder="Jane Doe" autocomplete="name" required />
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
              </svg>
            </div>
          </div>

          <div class="field">
            <label for="reg-email">Email</label>
            <div class="input-wrap">
              <input type="email" id="reg-email" name="email" placeholder="you@example.com" autocomplete="email" required />
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25H4.5A2.25 2.25 0 012.25 17.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5H4.5A2.25 2.25 0 002.25 6.75m19.5 0-9.75 6.75L2.25 6.75"/>
              </svg>
            </div>
          </div>

          <div class="field">
            <label for="reg-password">Password</label>
            <div class="input-wrap">
              <input type="password" id="reg-password" name="password" placeholder="Min. 8 characters" autocomplete="new-password" required minlength="8" />
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
              </svg>
              <button type="button" class="eye-btn" onclick="togglePwd('reg-password', this)" aria-label="Show password">
                <svg id="eye-reg" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="1.8" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
              </button>
            </div>
            <!-- Strength bar -->
            <div id="strength-bar" style="display:flex;gap:4px;margin-top:6px">
              <div class="seg" style="flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,0.12);transition:background .3s"></div>
              <div class="seg" style="flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,0.12);transition:background .3s"></div>
              <div class="seg" style="flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,0.12);transition:background .3s"></div>
              <div class="seg" style="flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,0.12);transition:background .3s"></div>
            </div>
          </div>

          <div class="field" style="margin-bottom:1.25rem">
            <label for="reg-confirm">Confirm Password</label>
            <div class="input-wrap">
              <input type="password" id="reg-confirm" name="confirm" placeholder="Repeat your password" autocomplete="new-password" required />
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/>
              </svg>
            </div>
          </div>

          <button type="submit" class="btn-primary">Create Account</button>

          <p class="terms">
            By creating an account you agree to our
            <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
          </p>

        </form>
      </div>

    </div>
  </main>

  <script>
    // ── Tab switching ──────────────────────────────────────
    function switchTab(name) {
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('active', b.id === 'tab-' + name);
        b.setAttribute('aria-selected', b.id === 'tab-' + name);
      });
      document.querySelectorAll('.form-panel').forEach(p => {
        p.classList.toggle('active', p.id === 'panel-' + name);
      });
      if (name === 'login') {
        document.querySelector('.brand h1').textContent = 'Welcome Back';
        document.querySelector('.brand p').textContent = 'Sign in to continue your journey';
      } else {
        document.querySelector('.brand h1').textContent = 'Create Account';
        document.querySelector('.brand p').textContent = 'Join us today — it\'s free';
      }
    }

    // ── Password visibility toggle ─────────────────────────
    function togglePwd(inputId, btn) {
      const input = document.getElementById(inputId);
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
      // swap icon to slash-eye when visible
      const svg = btn.querySelector('svg');
      if (isHidden) {
        svg.innerHTML = `
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/>`;
      } else {
        svg.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>`;
      }
    }

    // ── Password strength meter ────────────────────────────
    const pwdInput = document.getElementById('reg-password');
    const segs     = document.querySelectorAll('#strength-bar .seg');
    const colors   = ['#ef4444','#f97316','#eab308','#22c55e'];

    pwdInput.addEventListener('input', () => {
      const v = pwdInput.value;
      let score = 0;
      if (v.length >= 8)          score++;
      if (/[A-Z]/.test(v))        score++;
      if (/[0-9]/.test(v))        score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;

      segs.forEach((s, i) => {
        s.style.background = i < score ? colors[score - 1] : 'rgba(255,255,255,0.12)';
      });
    });

    // ── Form handlers (wire to your backend) ──────────────
    function handleLogin(e) {
      e.preventDefault();
      const email    = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      // TODO: call your auth API
      console.log('Login:', { email, password });
      alert('Sign in submitted — connect to your backend!');
    }

    function handleRegister(e) {
      e.preventDefault();
      const name     = document.getElementById('reg-name').value;
      const email    = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const confirm  = document.getElementById('reg-confirm').value;

      if (password !== confirm) {
        alert('Passwords do not match.');
        return;
      }
      // TODO: call your registration API
      console.log('Register:', { name, email, password });
      alert('Account created — connect to your backend!');
    }
  </script>
